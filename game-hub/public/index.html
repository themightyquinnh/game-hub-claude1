<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>
<style>
  :root{--bg:#0f1117;--card:#1a1d27;--ac:#7c5cff;--tx:#e8e8f0;--mut:#8b8fa3}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
  header{display:flex;gap:1rem;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid #262a38;flex-wrap:wrap}
  h1{margin:0;font-size:1.3rem}
  nav{display:flex;gap:.5rem;margin-left:auto}
  nav button{background:var(--card);color:var(--tx);border:1px solid #262a38;padding:.5rem 1rem;border-radius:8px;cursor:pointer}
  nav button.on{background:var(--ac);border-color:var(--ac)}
  main{padding:1.5rem;max-width:1100px;margin:auto}
  .hidden{display:none}
  input{width:100%;padding:.8rem 1rem;border-radius:10px;border:1px solid #262a38;background:var(--card);color:var(--tx);font-size:1rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;margin-top:1rem}
  .card{background:var(--card);border:1px solid #262a38;border-radius:12px;padding:1.2rem;cursor:pointer;transition:.15s}
  .card:hover{transform:translateY(-3px);border-color:var(--ac)}
  .card small{color:var(--mut)}
  iframe{width:100%;height:75vh;border:1px solid #262a38;border-radius:12px;background:#fff;margin-top:1rem}
  .bar{display:flex;gap:.5rem}
  .bar button{padding:.8rem 1.2rem;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
  .back{margin-top:1rem;background:none;border:1px solid #262a38;color:var(--tx);padding:.5rem 1rem;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>🎮 Game Hub</h1>
  <nav>
    <button id="tg" class="on">Games</button>
    <button id="tp">Web Proxy</button>
  </nav>
</header>
<main>
  <section id="games">
    <input id="filter" placeholder="Search games…">
    <div class="grid" id="grid"></div>
    <div id="player" class="hidden">
      <button class="back" id="back">← All games</button>
      <iframe id="gf" allowfullscreen></iframe>
    </div>
  </section>

  <section id="proxy" class="hidden">
    <form class="bar" id="pf">
      <input id="q" placeholder="Search the web or enter a URL…" autocomplete="off">
      <button>Go</button>
    </form>
    <iframe id="pframe"></iframe>
  </section>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  let games = [];

  fetch("games.json").then(r => r.json()).then(g => { games = g; render(""); });

  function render(f) {
    $("#grid").innerHTML = games
      .filter(g => g.title.toLowerCase().includes(f.toLowerCase()))
      .map(g => `<div class="card" data-p="${g.path}"><b>${g.title}</b><br><small>${g.tag || ""}</small></div>`)
      .join("") || "<p>No games found.</p>";
  }
  $("#filter").oninput = e => render(e.target.value);
  $("#grid").onclick = e => {
    const c = e.target.closest(".card"); if (!c) return;
    $("#gf").src = c.dataset.p;
    $("#grid").classList.add("hidden"); $("#filter").classList.add("hidden");
    $("#player").classList.remove("hidden");
  };
  $("#back").onclick = () => {
    $("#gf").src = "about:blank";
    $("#player").classList.add("hidden");
    $("#grid").classList.remove("hidden"); $("#filter").classList.remove("hidden");
  };

  function tab(on) {
    $("#games").classList.toggle("hidden", on !== "g");
    $("#proxy").classList.toggle("hidden", on !== "p");
    $("#tg").classList.toggle("on", on === "g");
    $("#tp").classList.toggle("on", on === "p");
  }
  $("#tg").onclick = () => tab("g");
  $("#tp").onclick = () => tab("p");

  $("#pf").onsubmit = e => {
    e.preventDefault();
    const v = $("#q").value.trim(); if (!v) return;
    $("#pframe").src = "/proxy?url=" + encodeURIComponent(v);
  };
</script>
</body>
</html>
